name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: gievano
          outputs: |
            dist/snake.svg?color_snake=333333&color_dots[0]=eeeeee&color_dots[1]=cccccc&color_dots[2]=999999&color_dots[3]=555555&color_dots[4]=111111
            dist/snake-dark.svg?color_snake=cccccc&color_dots[0]=222222&color_dots[1]=444444&color_dots[2]=666666&color_dots[3]=999999&color_dots[4]=ffffff
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
