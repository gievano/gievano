<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Gievano</title>
  <desc id="desc">A monochrome photocopied zine header with a torn paper label reading Gievano.</desc>

  <defs>
    <style>
      :root {
        --paper: #f4f3ed;
        --ink: #111111;
        --sheet: #111111;
        --sheet-ink: #f4f3ed;
        --muted: #65645f;
      }
      .paper { fill: var(--paper); }
      .ink-fill { fill: var(--ink); }
      .ink-line { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
      .sheet { fill: var(--sheet); }
      .sheet-ink { fill: var(--sheet-ink); }
      .sheet-line { fill: none; stroke: var(--sheet-ink); stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: var(--muted); }
      .marker {
        --draw-delay: 3.75s;
        --draw-duration: 1.25s;
      }
      .smoke-line {
        --draw-delay: 3.55s;
        --draw-duration: 1.45s;
      }
      .cutout {
        transform-box: fill-box;
        transform-origin: center;
        animation: paste-in .7s cubic-bezier(.22, 1, .36, 1) both;
      }
      .title-wipe { animation: wipe-title .9s cubic-bezier(.65, 0, .35, 1) .72s both; }
      .guide-wipe { animation: wipe-guide .7s cubic-bezier(.65, 0, .35, 1) .5s both; }
      .sheet-copy {
        opacity: 0;
        animation: reveal-copy .5s ease-out var(--copy-delay, .45s) both;
      }
      .subtitle { --copy-delay: 1.5s; }
      .tape-left, .tape-right {
        transform-box: fill-box;
        transform-origin: center;
        animation: tape-flutter 5s ease-in-out 2.5s infinite alternate;
      }
      .tape-right { animation-delay: 3s; animation-direction: alternate-reverse; }
      .draw-path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw-path var(--draw-duration, 1s) cubic-bezier(.65, 0, .35, 1) var(--draw-delay, 1.7s) both;
      }
      .arrow-right { --draw-delay: 1.9s; }
      .squiggle { --draw-delay: 2.05s; }
      .note {
        opacity: 0;
        animation: note-in .5s ease-out var(--note-delay, 2s) both;
      }
      .note-right { --note-delay: 2.2s; }
      .footer-note { opacity: 0; animation: reveal-copy .55s ease-out 2.15s both; }
      .halftone { animation: breathe 5s ease-in-out 2.4s infinite alternate; }
      .paper-plane {
        opacity: 0;
      }
      .plane-body {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .plane-fold {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1;
        stroke-linecap: round;
      }
      @keyframes paste-in {
        from { opacity: 0; transform: translateY(-12px) rotate(-.7deg) scale(.985); }
        to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      }
      @keyframes draw-path { to { stroke-dashoffset: 0; } }
      @keyframes wipe-title { from { width: 0; } to { width: 545px; } }
      @keyframes wipe-guide { from { width: 0; } to { width: 510px; } }
      @keyframes reveal-copy {
        from { opacity: 0; transform: translateX(-6px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes note-in {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes breathe {
        from { opacity: .55; }
        to { opacity: 1; }
      }
      @keyframes tape-flutter {
        from { transform: rotate(-.35deg) translateY(0); }
        to { transform: rotate(.35deg) translateY(-1px); }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d1117;
          --ink: #f2f1eb;
          --sheet: #f2f1eb;
          --sheet-ink: #111111;
          --muted: #aaa9a3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .marker, .cutout, .title-wipe, .guide-wipe, .sheet-copy, .tape-left, .tape-right, .draw-path, .note, .footer-note, .halftone, .paper-plane { animation: none; }
        .title-wipe { width: 545px; }
        .guide-wipe { width: 510px; }
        .draw-path { stroke-dashoffset: 0; }
        .sheet-copy, .note, .footer-note { opacity: 1; }
        .paper-plane { display: none; }
      }
    </style>

    <filter id="rough" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="24" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8"/>
    </filter>
    <filter id="smoke" x="-4%" y="-120%" width="108%" height="340%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="ink-fill" opacity="0.16"/>
    </pattern>
    <pattern id="copy-lines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1 H6 M0 4 H6" class="sheet-line" stroke-width="0.45" opacity="0.13"/>
    </pattern>
    <clipPath id="title-reveal">
      <rect class="title-wipe" x="178" y="99" width="0" height="78"/>
    </clipPath>
    <clipPath id="guide-reveal">
      <rect class="guide-wipe" x="200" y="94" width="0" height="18"/>
    </clipPath>
  </defs>

  <rect class="paper" width="900" height="300"/>
  <path class="halftone" d="M0 0 H175 L130 90 H0 Z" fill="url(#dots)"/>
  <path class="halftone" d="M900 300 H702 L770 214 H900 Z" fill="url(#dots)"/>

  <g font-family="Courier New, monospace" font-size="10" font-weight="700" letter-spacing="1.8">
    <text class="muted" x="28" y="26">PROFILE CUTOUT / 024</text>
    <text class="muted" x="872" y="26" text-anchor="end">JAKARTA, ID</text>
  </g>

  <g class="ink-line" stroke-width="1.5" opacity="0.78">
    <path class="draw-path" pathLength="1" d="M58 111 C87 96 119 93 164 101 M155 95 L165 101 153 105"/>
    <path class="draw-path arrow-right" pathLength="1" d="M744 186 C784 188 810 180 835 160 M829 158 L836 159 835 167"/>
  </g>
  <g class="muted" font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="1.4">
    <g class="note"><text x="31" y="126" transform="rotate(-6 31 126)">VISUAL DESIGN</text></g>
    <g class="note note-right"><text x="779" y="143" transform="rotate(5 779 143)">SMALL TOOLS</text></g>
  </g>

  <g class="cutout">
  <g class="drift">
  <g transform="rotate(-2 450 145)">
    <path class="sheet" filter="url(#rough)" d="M166 60 L217 51 278 57 343 49 412 55 476 50 542 57 610 51 676 59 742 55 736 99 744 142 737 184 746 224 681 220 617 228 550 221 482 227 414 220 345 226 278 218 218 224 160 214 169 172 158 132 168 96 Z"/>
    <path d="M178 68 L730 65 731 211 174 208 Z" fill="url(#copy-lines)" opacity="0.65"/>

    <g class="sheet-ink" font-family="Courier New, monospace">
      <text class="sheet-copy" x="194" y="87" font-size="10" font-weight="700" letter-spacing="2">FIELD NOTE / GVN</text>
      <text class="sheet-copy" x="708" y="87" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2">DRAW + DEBUG</text>
      <text x="451" y="166" text-anchor="middle" clip-path="url(#title-reveal)" font-family="Arial Black, Impact, Arial, sans-serif" font-size="83" font-weight="900" letter-spacing="5">GIEVANO</text>
      <text class="sheet-copy subtitle" x="451" y="197" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3">VISUAL DESIGN / CODE &amp; SYSTEMS</text>
    </g>

    <path class="sheet-line smoke-line draw-path" pathLength="1" d="M236 177 C340 187 526 187 665 174" stroke-width="5" opacity="0.16" filter="url(#smoke)"/>
    <path class="sheet-line marker draw-path" pathLength="1" d="M236 177 C340 187 526 187 665 174" stroke-width="1.5"/>
    <path class="sheet-line" clip-path="url(#guide-reveal)" d="M207 103 L698 103" stroke-width="0.8" stroke-dasharray="3 7" opacity="0.42"/>
  </g>
  </g>
  </g>

  <g class="paper-plane" aria-hidden="true">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" begin=".75s" dur="2.8s" fill="freeze"/>
    <animateMotion path="M18 48 C150 12 320 92 450 212 C585 272 735 120 904 42" rotate="auto" begin=".75s" dur="2.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>
    <path class="plane-body" d="M0 0 L24 7 8 12 5 21 0 0 Z"/>
    <path class="plane-fold" d="M8 12 L24 7 5 21 M8 12 L12 17"/>
  </g>

  <g class="ink-line" stroke-width="1.2" opacity="0.7">
    <path class="tape-left" d="M180 47 l22 -13 30 5 -7 20"/>
    <path class="tape-right" d="M671 226 l8 18 31 -6 8 -19"/>
    <path class="draw-path squiggle" pathLength="1" d="M42 247 c24 -13 45 14 68 -2 s44 10 65 -1"/>
  </g>

  <g class="footer-note" font-family="Courier New, monospace" font-weight="700">
    <text class="ink-fill" x="31" y="277" font-size="12" letter-spacing="2.4">SKETCH / BUILD / REFINE</text>
    <text class="muted" x="872" y="277" text-anchor="end" font-size="10" letter-spacing="1.8">USEFUL THINGS, ROUGH EDGES.</text>
  </g>
</svg>
