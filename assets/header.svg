<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Gievano</title>
  <desc id="desc">A monochrome photocopied zine header with a torn paper label reading Gievano.</desc>

  <defs>
    <style>
      :root {
        --paper: #f4f3ed;
        --ink: #111111;
        --sheet: #111111;
        --sheet-ink: #f4f3ed;
        --muted: #65645f;
      }
      .paper { fill: var(--paper); }
      .ink-fill { fill: var(--ink); }
      .ink-line { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
      .sheet { fill: var(--sheet); }
      .sheet-ink { fill: var(--sheet-ink); }
      .sheet-line { fill: none; stroke: var(--sheet-ink); stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: var(--muted); }
      .marker {
        stroke-dasharray: 470;
        stroke-dashoffset: 470;
        animation: mark 6s cubic-bezier(.7, 0, .25, 1) infinite;
      }
      .cutout {
        transform-box: fill-box;
        transform-origin: center;
        animation: paste-in .8s cubic-bezier(.2, .8, .2, 1) both;
      }
      .drift {
        transform-box: fill-box;
        transform-origin: center;
        animation: paper-drift 6s ease-in-out 1s infinite alternate;
      }
      .title-main { animation: print-jitter 3.2s steps(1, end) 1.4s infinite; }
      .tape-left, .tape-right {
        transform-box: fill-box;
        transform-origin: center;
        animation: tape-flutter 4.5s ease-in-out 1s infinite alternate;
      }
      .tape-right { animation-delay: 1.7s; animation-direction: alternate-reverse; }
      .arrow {
        stroke-dasharray: 150;
        stroke-dashoffset: 150;
        animation: draw-arrow 1s ease-out .55s both;
      }
      .note {
        opacity: 0;
        animation: note-in .45s ease-out 1.25s both;
      }
      .halftone { animation: breathe 4s ease-in-out infinite alternate; }
      .squiggle {
        stroke-dasharray: 150;
        stroke-dashoffset: 150;
        animation: draw-arrow 1.2s ease-out 1.55s both;
      }
      @keyframes paste-in {
        from { opacity: 0; transform: translateY(-18px) rotate(-1.5deg) scale(.97); }
        to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      }
      @keyframes draw-arrow { to { stroke-dashoffset: 0; } }
      @keyframes note-in {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes breathe {
        from { opacity: .55; }
        to { opacity: 1; }
      }
      @keyframes paper-drift {
        from { transform: translate(-1px, 1px) rotate(-.12deg); }
        to { transform: translate(1px, -1px) rotate(.12deg); }
      }
      @keyframes print-jitter {
        0%, 91%, 100% { transform: translate(0); }
        92% { transform: translate(1px, -1px); }
        94% { transform: translate(-1px, 1px); }
        96% { transform: translate(1px, 0); }
      }
      @keyframes tape-flutter {
        from { transform: rotate(-.35deg) translateY(0); }
        to { transform: rotate(.35deg) translateY(-1px); }
      }
      @keyframes mark {
        0%, 12% { stroke-dashoffset: 470; opacity: 0; }
        16% { opacity: 1; }
        48%, 88% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d1117;
          --ink: #f2f1eb;
          --sheet: #f2f1eb;
          --sheet-ink: #111111;
          --muted: #aaa9a3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .marker, .cutout, .drift, .title-main, .tape-left, .tape-right, .arrow, .note, .halftone, .squiggle { animation: none; }
        .marker, .arrow, .squiggle { stroke-dashoffset: 0; opacity: 1; }
        .note { opacity: 1; }
      }
    </style>

    <filter id="rough" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="24" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8"/>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="ink-fill" opacity="0.16"/>
    </pattern>
    <pattern id="copy-lines" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1 H6 M0 4 H6" class="sheet-line" stroke-width="0.45" opacity="0.13"/>
    </pattern>
  </defs>

  <rect class="paper" width="900" height="300"/>
  <path class="halftone" d="M0 0 H175 L130 90 H0 Z" fill="url(#dots)"/>
  <path class="halftone" d="M900 300 H702 L770 214 H900 Z" fill="url(#dots)"/>

  <g font-family="Courier New, monospace" font-size="10" font-weight="700" letter-spacing="1.8">
    <text class="muted" x="28" y="26">PROFILE CUTOUT / 024</text>
    <text class="muted" x="872" y="26" text-anchor="end">JAKARTA, ID</text>
  </g>

  <g class="ink-line" stroke-width="1.5" opacity="0.78">
    <path class="arrow" d="M58 111 C87 96 119 93 164 101 M155 95 L165 101 153 105"/>
    <path class="arrow" d="M744 186 C784 188 810 180 835 160 M829 158 L836 159 835 167"/>
  </g>
  <g class="muted" font-family="Courier New, monospace" font-size="11" font-weight="700" letter-spacing="1.4">
    <g class="note"><text x="31" y="126" transform="rotate(-6 31 126)">VISUAL DESIGN</text></g>
    <g class="note"><text x="779" y="143" transform="rotate(5 779 143)">SMALL TOOLS</text></g>
  </g>

  <g class="cutout">
  <g class="drift">
  <g transform="rotate(-2 450 145)">
    <path class="sheet" filter="url(#rough)" d="M166 60 L217 51 278 57 343 49 412 55 476 50 542 57 610 51 676 59 742 55 736 99 744 142 737 184 746 224 681 220 617 228 550 221 482 227 414 220 345 226 278 218 218 224 160 214 169 172 158 132 168 96 Z"/>
    <path d="M178 68 L730 65 731 211 174 208 Z" fill="url(#copy-lines)" opacity="0.65"/>

    <g class="sheet-ink" font-family="Courier New, monospace">
      <text x="194" y="87" font-size="10" font-weight="700" letter-spacing="2">FIELD NOTE / GVN</text>
      <text x="708" y="87" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2">DRAW + DEBUG</text>
      <text class="title-main" x="451" y="166" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-size="83" font-weight="900" letter-spacing="5">GIEVANO</text>
      <text x="451" y="197" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3">VISUAL DESIGN / CODE &amp; SYSTEMS</text>
    </g>

    <path class="sheet-line marker" d="M236 177 C340 187 526 187 665 174" stroke-width="5" filter="url(#rough)"/>
    <path class="sheet-line" d="M207 103 L698 103" stroke-width="0.8" stroke-dasharray="3 7" opacity="0.42"/>
  </g>
  </g>
  </g>

  <g class="ink-line" stroke-width="1.2" opacity="0.7">
    <path class="tape-left" d="M180 47 l22 -13 30 5 -7 20"/>
    <path class="tape-right" d="M671 226 l8 18 31 -6 8 -19"/>
    <path class="squiggle" d="M42 247 c24 -13 45 14 68 -2 s44 10 65 -1"/>
  </g>

  <g font-family="Courier New, monospace" font-weight="700">
    <text class="ink-fill" x="31" y="277" font-size="12" letter-spacing="2.4">SKETCH / BUILD / REFINE</text>
    <text class="muted" x="872" y="277" text-anchor="end" font-size="10" letter-spacing="1.8">USEFUL THINGS, ROUGH EDGES.</text>
  </g>
</svg>
